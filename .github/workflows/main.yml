name: Build WhiteClient

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 8
        uses: actions/setup-java@v4
        with:
          java-version: '8'
          distribution: 'zulu'

      - name: Cache Gradle home
        uses: actions/cache@v4
        with:
          path: ~/.gradle
          key: ${{ runner.os }}-gradle-${{ hashFiles('build.gradle','gradle.properties') }}
          restore-keys: ${{ runner.os }}-gradle-

      - name: Generate Gradle wrapper
        run: gradle wrapper --gradle-version 4.9

      - name: Setup Forge workspace (attempt 1)
        id: setup1
        continue-on-error: true
        run: ./gradlew setupDecompWorkspace --no-daemon --stacktrace
        timeout-minutes: 50

      - name: Setup Forge workspace (attempt 2 if failed)
        if: steps.setup1.outcome == 'failure'
        run: ./gradlew setupDecompWorkspace --no-daemon --stacktrace
        timeout-minutes: 50

      - name: Build mod
        run: ./gradlew build --no-daemon
        timeout-minutes: 20

      - name: Upload JAR
        uses: actions/upload-artifact@v4
        with:
          name: WhiteClient-1.12.2
          path: build/libs/*.jar
          if-no-files-found: error
